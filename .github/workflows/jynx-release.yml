# Jynx Observatory release lane. This intentionally publishes only fork-owned
# GitHub assets; upstream npm, PyPI, MCP Registry, and VirusTotal credentials are
# neither required nor referenced.
name: Jynx Edition Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Jynx version (for example v0.9.0-jynx.2)"
        required: true
        type: string
      release_notes:
        description: "Optional release notes (generated when empty)"
        required: false
        type: string

concurrency:
  group: jynx-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ARCHIVE: codebase-memory-mcp-ui-darwin-arm64.tar.gz
    steps:
      - name: Require the main branch release ref
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Jynx releases may only be built from refs/heads/main" >&2
            exit 2
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate Jynx version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-jynx\.[0-9]+$ ]] || {
            echo "invalid Jynx version: $VERSION" >&2
            exit 2
          }

      - name: Test release safety contracts
        run: |
          bash scripts/test-jynx-installer.sh
          python3 scripts/test-jynx-release-workflow.py

      - name: Test Graph UI
        working-directory: graph-ui
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Build UI-enabled Apple Silicon binary
        run: scripts/build.sh --with-ui --version "$VERSION"

      - name: Package with canonical release layout
        run: |
          mkdir -p dist
          scripts/package-release.sh darwin arm64 --variant ui --out-dir dist \
            --installer scripts/jynx-install.sh
          cp scripts/jynx-install.sh dist/jynx-install.sh
          chmod 755 dist/jynx-install.sh

      - name: Generate SHA-256 manifest
        run: |
          cd dist
          shasum -a 256 "$ARCHIVE" jynx-install.sh > checksums.txt

      - name: Smoke packaged Jynx identity and UI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/jynx-smoke"
          tar -xzf "dist/$ARCHIVE" -C "$RUNNER_TEMP/jynx-smoke"
          CANDIDATE="$RUNNER_TEMP/jynx-smoke/codebase-memory-mcp"
          test "$("$CANDIDATE" --version)" = "codebase-memory-mcp ${VERSION#v}"

          (tail -f /dev/null | "$CANDIDATE") >"$RUNNER_TEMP/jynx-smoke/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do
            if curl --fail --silent --show-error http://127.0.0.1:9749/ \
              --output "$RUNNER_TEMP/jynx-smoke/index.html"; then
              break
            fi
            sleep 0.25
          done
          grep -Fq "Jynx Observatory" "$RUNNER_TEMP/jynx-smoke/index.html"
          curl --fail --silent --show-error http://127.0.0.1:9749/favicon.svg \
            --output "$RUNNER_TEMP/jynx-smoke/favicon.svg"
          grep -Fq "#ff3ea5" "$RUNNER_TEMP/jynx-smoke/favicon.svg"
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload verified release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jynx-release-${{ inputs.version }}
          path: |
            dist/codebase-memory-mcp-ui-darwin-arm64.tar.gz
            dist/jynx-install.sh
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      ARCHIVE: codebase-memory-mcp-ui-darwin-arm64.tar.gz
    steps:
      - name: Download verified release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jynx-release-${{ inputs.version }}
          path: dist

      - name: Re-verify artifact handoff
        shell: bash
        run: |
          cd dist
          shasum -a 256 -c checksums.txt
          test -f "$ARCHIVE"
          test -f jynx-install.sh

      - name: Attest Jynx release provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/codebase-memory-mcp-ui-darwin-arm64.tar.gz
            dist/jynx-install.sh
            dist/checksums.txt

  publish:
    if: github.ref == 'refs/heads/main'
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      ARCHIVE: codebase-memory-mcp-ui-darwin-arm64.tar.gz
    steps:
      - name: Download attested release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jynx-release-${{ inputs.version }}
          path: dist

      - name: Re-verify artifact handoff
        shell: bash
        run: |
          cd dist
          shasum -a 256 -c checksums.txt
          test -f "$ARCHIVE"
          test -f jynx-install.sh

      - name: Publish Jynx GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          RELEASE_ARGS=(
            "$VERSION"
            "dist/$ARCHIVE"
            dist/jynx-install.sh
            dist/checksums.txt
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Jynx Observatory ${VERSION#v}"
            --latest
          )
          if [ -n "$RELEASE_NOTES" ]; then
            gh release create "${RELEASE_ARGS[@]}" --notes "$RELEASE_NOTES"
          else
            gh release create "${RELEASE_ARGS[@]}" --generate-notes
          fi
